name: Refresh screener

# Runs the screen two hours before the open and commits data/today.json, which
# is what redeploys the dashboard on Vercel.
#
# GitHub cron is UTC-only, so 07:30 ET is two entries and a guard rather than
# one line: 11:30 UTC is 07:30 EDT (summer) but 06:30 EST (winter), and 12:30
# UTC is the reverse. Both fire year-round; the guard step lets exactly one of
# them through, whichever currently lands in the 07:00-08:30 ET window. The
# window is deliberately wider than a minute because GitHub's scheduler runs
# late under load -- better a refresh at 07:50 than none that day.
on:
  schedule:
    - cron: "30 11 * * 1-5"
    - cron: "30 12 * * 1-5"
  workflow_dispatch: # manual runs skip the time guard entirely

permissions:
  contents: write

concurrency:
  group: refresh-screener
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Should this run fire?
        id: guard
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime

          from warrior_screener.market_calendar import EASTERN, is_trading_day

          now = datetime.now(EASTERN)
          # A holiday is not a session: TradingView would happily serve the
          # previous session's numbers, and the board would claim them as today's.
          trading = is_trading_day(now.date())
          in_window = (7, 0) <= (now.hour, now.minute) < (8, 30)
          run = trading and in_window
          print(f"run={'true' if run else 'false'}")
          print(f"why=ET {now:%Y-%m-%d %H:%M %Z} trading_day={trading} in_window={in_window}")
          PY

      - name: Skipped
        if: github.event_name == 'schedule' && steps.guard.outputs.run != 'true'
        run: echo "Not the pre-open slot for this timezone -- ${{ steps.guard.outputs.why }}"

      - name: Run the screen
        if: github.event_name != 'schedule' || steps.guard.outputs.run == 'true'
        run: python -m warrior_screener snapshot --json data/today.json

      - name: Commit the scan
        if: github.event_name != 'schedule' || steps.guard.outputs.run == 'true'
        run: |
          if git diff --quiet -- data/today.json; then
            echo "Screen produced no change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          git commit -m "Refresh screener for $(TZ=America/New_York date +%Y-%m-%d)"
          git push

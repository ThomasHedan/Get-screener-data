name: Refresh screener

# Manual escape hatch only.
#
# This used to run on a schedule and commit data/today.json, which was the sole
# path to fresh data on the board. GitHub's cron is best-effort: on 2026-09-10
# it never fired once on this active, correctly configured workflow, and the
# board silently served the previous session. The scan is now driven by
# warrior_screener/scheduler.py in the extractor container, which owns its own
# clock -- see DEPLOY.md.
#
# The schedule is deliberately gone rather than merely widened: two writers for
# one data/today.json is a conflict waiting to happen, and the container is the
# one that matters now. Kept dispatchable so a scan can still be forced from
# the Actions tab without a shell on the host. The time guard went with the
# schedule -- a human clicking "Run workflow" has already decided it is time.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-screener
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the screen
        run: python -m warrior_screener snapshot --json data/today.json

      - name: Commit the scan
        run: |
          if git diff --quiet -- data/today.json; then
            echo "Screen produced no change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          git commit -m "Refresh screener for $(TZ=America/New_York date +%Y-%m-%d)"
          git push
